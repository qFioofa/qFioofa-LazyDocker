# yaml-language-server: $schema=https://json.schemastore.org/lazydocker.json

gui:
  scrollHeight: 3
  language: "auto"
  scrollPastBottom: false
  # NOTE: this maps to IgnoreMouseEvents upstream, so true DISABLES the mouse.
  mouseEvents: false
  showAllContainers: false
  returnImmediately: false
  wrapMainPanel: true
  sidePanelWidth: 0.3333
  showBottomLine: true
  expandFocusedSidePanel: false
  screenMode: "normal"
  containerStatusHealthStyle: "long"
  border: "rounded"

confirmOnQuit: false

logs:
  timestamps: true
  since: "60m"
  tail: "500"

stats:
  maxDuration: 5m
  graphs:
    - caption: "CPU (%)"
      statPath: "DerivedStats.CPUPercentage"
      color: "cyan"
      height: 6
    - caption: "Memory (%)"
      statPath: "DerivedStats.MemoryPercentage"
      color: "green"
      height: 6
    - caption: "Net RX"
      statPath: "ClientStats.Networks.Eth0.RxBytes"
      color: "yellow"
      height: 4
    - caption: "Net TX"
      statPath: "ClientStats.Networks.Eth0.TxBytes"
      color: "magenta"
      height: 4

commandTemplates:
  dockerCompose: "docker compose"
  restartService: '{{ .DockerCompose }} up -d --force-recreate {{ .Service.Name }}'
  allLogs: '{{ .DockerCompose }} logs --tail=300 --follow'
  # NOTE: the upstream yaml key is the misspelled `viewAlLogs`, not `viewAllLogs`.

customCommands:
  containers:
    - name: sh
      attach: true
      shell: true
      command: 'docker exec -it {{ .Container.ID }} sh'
    - name: bash
      attach: true
      shell: true
      command: 'docker exec -it {{ .Container.ID }} bash'
    - name: inspect
      attach: true
      shell: true
      command: 'docker inspect {{ .Container.ID }} | less -R'
    - name: top
      attach: true
      shell: true
      command: 'docker top {{ .Container.ID }}'
    - name: diff
      attach: true
      shell: true
      command: 'docker diff {{ .Container.ID }} | less -R'
    - name: logs (100 lines)
      attach: true
      shell: true
      command: 'docker logs --tail=100 --follow {{ .Container.ID }}'
    - name: stats
      attach: true
      shell: true
      command: 'docker stats --no-stream {{ .Container.ID }}'
    - name: copy id
      attach: false
      shell: true
      command: 'id="{{ .Container.ID }}"; if command -v wl-copy >/dev/null 2>&1; then printf %s "$id" | wl-copy; elif command -v xclip >/dev/null 2>&1; then printf %s "$id" | xclip -selection clipboard; elif command -v xsel >/dev/null 2>&1; then printf %s "$id" | xsel -ib; else printf %s "$id"; fi'
    - name: port mappings
      attach: true
      shell: true
      command: 'docker port {{ .Container.ID }}'
    - name: pause
      attach: false
      shell: true
      command: 'docker pause {{ .Container.ID }}'
    - name: unpause
      attach: false
      shell: true
      command: 'docker unpause {{ .Container.ID }}'
    - name: system df
      attach: true
      shell: true
      command: 'docker system df'
    - name: export tar
      attach: false
      shell: true
      command: 'docker export {{ .Container.ID }} > {{ .Container.ID }}.tar'
    - name: restart (force)
      attach: false
      shell: true
      command: 'docker rm -f {{ .Container.ID }} && {{ .DockerCompose }} up -d'

  services:
    - name: env
      attach: true
      shell: true
      command: '{{ .DockerCompose }} exec {{ .Service.Name }} env | less -R'
    - name: logs (500 lines)
      attach: true
      shell: true
      command: '{{ .DockerCompose }} logs --tail=500 --follow {{ .Service.Name }}'
    - name: exec bash
      attach: true
      shell: true
      command: '{{ .DockerCompose }} exec {{ .Service.Name }} bash'
    - name: exec sh
      attach: true
      shell: true
      command: '{{ .DockerCompose }} exec {{ .Service.Name }} sh'
    - name: rebuild
      attach: true
      shell: true
      command: '{{ .DockerCompose }} up -d --build --force-recreate {{ .Service.Name }}'
    - name: restart (force recreate)
      attach: false
      shell: true
      command: '{{ .DockerCompose }} up -d --force-recreate {{ .Service.Name }}'
    - name: top
      attach: true
      shell: true
      command: '{{ .DockerCompose }} top {{ .Service.Name }}'
    - name: restart deps
      attach: false
      shell: true
      command: '{{ .DockerCompose }} restart {{ .Service.Name }}'
    - name: pull
      attach: true
      shell: true
      command: '{{ .DockerCompose }} pull {{ .Service.Name }}'
    - name: config
      attach: true
      shell: true
      command: '{{ .DockerCompose }} config | less -R'
    - name: ps
      attach: true
      shell: true
      command: '{{ .DockerCompose }} ps'
    - name: images
      attach: true
      shell: true
      command: '{{ .DockerCompose }} images'
    - name: watch
      attach: true
      shell: true
      command: '{{ .DockerCompose }} watch'

  images:
    - name: inspect
      attach: true
      shell: true
      command: 'docker inspect {{ .Image.Name }} | less -R'
    - name: history
      attach: true
      shell: true
      command: 'docker history {{ .Image.Name }} | less -R'
    - name: tag latest
      attach: false
      shell: true
      command: 'docker tag {{ .Image.Name }} {{ .Image.Name }}:latest'
    - name: dive
      attach: true
      shell: true
      command: 'dive {{ .Image.Name }}:{{ .Image.Tag }}'
    - name: scout cves
      attach: true
      shell: true
      command: 'docker scout cves {{ .Image.Name }} | less -R'

  volumes:
    - name: inspect
      attach: true
      shell: true
      command: 'docker volume inspect {{ .Volume.Name }} | less -R'
    - name: browse files
      attach: true
      shell: true
      command: 'docker run --rm -v {{ .Volume.Name }}:/data alpine ls -la /data'
    - name: browse shell
      attach: true
      shell: true
      command: 'docker run --rm -it -v {{ .Volume.Name }}:/data alpine sh'

  networks:
    - name: inspect
      attach: true
      shell: true
      command: 'docker network inspect {{ .Network.Name }} | less -R'
    - name: list containers
      attach: true
      shell: true
      command: 'docker network inspect {{ .Network.Name }} -f "{{ range .Containers }}{{ .Name }} {{ end }}"'

bulkCommands:
  containers:
    - name: stop all
      shell: true
      command: 'docker stop $(docker ps -q)'
    - name: kill all
      shell: true
      command: 'docker kill $(docker ps -q)'
    - name: restart all
      shell: true
      command: 'docker restart $(docker ps -q)'
    - name: pause all
      shell: true
      command: 'docker pause $(docker ps -q)'
    - name: unpause all
      shell: true
      command: 'docker unpause $(docker ps -aq --filter status=paused)'
    - name: remove stopped
      shell: true
      command: 'docker container prune -f'

  services:
    - name: up
      command: '{{ .DockerCompose }} up -d'
    - name: up (attached)
      attach: true
      command: '{{ .DockerCompose }} up'
    - name: stop
      command: '{{ .DockerCompose }} stop'
    - name: pull
      attach: true
      command: '{{ .DockerCompose }} pull'
    - name: build
      attach: true
      command: '{{ .DockerCompose }} build --parallel --force-rm'
    - name: down
      command: '{{ .DockerCompose }} down'
    - name: down with volumes
      command: '{{ .DockerCompose }} down --volumes'
    - name: down with images
      command: '{{ .DockerCompose }} down --rmi all'
    - name: down with volumes and images
      command: '{{ .DockerCompose }} down --volumes --rmi all'
    - name: ps
      command: '{{ .DockerCompose }} ps'
    - name: config
      attach: true
      command: '{{ .DockerCompose }} config'
    - name: images
      command: '{{ .DockerCompose }} images'
    - name: recreate all
      attach: true
      command: '{{ .DockerCompose }} up -d --force-recreate'

  images:
    - name: prune unused
      shell: true
      command: 'docker image prune -a -f'
    - name: prune dangling
      shell: true
      command: 'docker image prune -f'
    - name: system df
      shell: true
      command: 'docker system df'

  volumes:
    - name: prune unused
      shell: true
      command: 'docker volume prune -f'

  networks:
    - name: prune unused
      shell: true
      command: 'docker network prune -f'

replacements:
  imageNamePrefixes:
    "docker.io/": ""
    "ghcr.io/": ""

# NOTE: `ignore` is undocumented upstream and may change between releases.
# Any list item whose display text contains one of these substrings is hidden.
ignore:
  - "<none>"
  - "buildkit"

oS:
  openCommand: "xdg-open {{filename}}"
  openLinkCommand: "xdg-open {{link}}"
