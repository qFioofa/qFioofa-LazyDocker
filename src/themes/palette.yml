# yugen-ash palette (mirror of ../yugen-ash.nvim/lua/yugen-ash/palette.lua → "main")
#
# This is the single source of truth for theme colors.
# Theme files reference entries as "@<key>" (e.g. "@primary"); deploy.sh and
# flake.nix resolve those tokens to their hex value at build time.

palette:
  color100: "#FAFAFA"
  color200: "#D4D4D4"
  color300: "#A9A9A9"
  color400: "#696969"
  color500: "#505050"
  color600: "#303030"
  color700: "#151515"
  color800: "#000000"

  primary: "#FFBE89"
  success: "#7EAB8E"
  warning: "#FFF2AF"
  error: "#F57A7A"
  tide: "#79a0aa"
  violet: "#c678dd"
  gold: "#D4A017"
  sage: "#9db89c"
  seafoam: "#8dd3c3"
  coral: "#FF9E8B"
  amber: "#D4A76A"
  crimson: "#bf616a"
